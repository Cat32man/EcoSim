name: Package and Release TurboWarp Project

on:
  push:
    branches:
      - main
    paths:
      - 'EcoSim.sb3'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Fixes the slowdown by telling GitHub to download only the 2 most recent commits
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Version From Commit
        id: get_version
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          
          if [ -z "$VERSION" ]; then
            VERSION="v0.0.${{ github.run_number }}"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Project with TurboWarp Packager
        run: |
          mkdir dist
          npx turbowarp-packager-cli -i EcoSim.sb3 -o dist/index.html

      # Uses lightweight tags so Git doesn't build heavy release history trees
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          files: dist/index.html
          generate_release_notes: true
