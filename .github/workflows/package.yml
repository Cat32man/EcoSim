name: Package and Release TurboWarp Project

on:
  push:
    branches:
      - main
    paths:
      - 'EcoSim.sb3' # Only runs when your game file is updated
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Extracts the tag name directly from the commit message
      - name: Extract Version From Commit
        id: get_version
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          # Searches for a pattern like vX.Y.Z in the commit message
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          
          # Fallback if you forget to include a version in the commit name
          if [ -z "$VERSION" ]; then
            VERSION="v0.0.${{ github.run_number }}"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Packages your exact EcoSim.sb3 file
      - name: Build Project with TurboWarp Packager
        run: |
          mkdir dist
          npx turbowarp-packager-cli -i EcoSim.sb3 -o dist/index.html

      # Creates a new release utilizing your commit's version name
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          files: dist/index.html
          generate_release_notes: true
